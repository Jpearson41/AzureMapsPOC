<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>My Contoso Indoor Maps App</title>
    
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.css" type="text/css" />
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/indoor/0.2/atlas-indoor.min.css" type="text/css" />
    
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js"></script>
    <script src="https://atlas.microsoft.com/sdk/javascript/indoor/0.2/atlas-indoor.min.js"></script>
    
    <!-- Add reference to the animation module. -->
    <script src="azure-maps-animations.min.js"></script>
    <script src="azure-maps-geolocation-control.min.js"></script>

    <script>
        
        const mapConfigurationID = 'a92d5e3f-84c8-aecf-ebeb-e65a99020a88';
        const subscriptionKey = 'r7IfFwTpdzKxzJlB_FhqcmUnHj-ltlDdVk2fv41r8R0';
        const statesetID = '4a7d5015-5329-58c6-8d6c-cd76ca3a1f09';
        atlas.setDomain('us.atlas.microsoft.com');

        var map, pin, lineSource, pinSource;
        var animation;
        var geolocationControl;
        var routePoints = [
                new atlas.data.Feature(new atlas.data.Point([-122.132461676523, 47.63670759985109]), { _timestamp: new Date('Wed, 10 May 2023 00:53:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.132461676523, 47.63668612735674]), { _timestamp: new Date('Wed, 10 May 2023 00:54:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.13236806905644, 47.63668344329429]), { _timestamp: new Date('Wed, 10 May 2023 00:56:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.1322704782929, 47.63668210126298]), { _timestamp: new Date('Wed, 10 May 2023 00:59:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.1321788624746, 47.63668612735674]), { _timestamp: new Date('Wed, 10 May 2023 01:02:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.13213106291718, 47.63664855047003]), { _timestamp: new Date('Wed, 10 May 2023 01:04:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.13213504621332, 47.63659486915728]), { _timestamp: new Date('Wed, 10 May 2023 01:06:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.13213504621332, 47.63653045150829]), { _timestamp: new Date('Wed, 10 May 2023 01:08:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.13213902950989, 47.6364633497067]), { _timestamp: new Date('Wed, 10 May 2023 01:10:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.13206932182183, 47.636433824887035]), { _timestamp: new Date('Wed, 10 May 2023 01:12:53 GMT').getTime() }),
                new atlas.data.Feature(new atlas.data.Point([-122.1320474136912, 47.63643248284936]), { _timestamp: new Date('Wed, 10 May 2023 01:12:53 GMT').getTime() })
            ];
        function GetMap() {           
            //Initialize a map instance.
            var map = new atlas.Map('myMap', {
                bounds: [
                    -122.132858514411,
                    47.636151996219,
                    -122.131668500638,
                    47.63695721695
                ],
                style: 'grayscale_light',
                view: 'Auto',
                zoom: 13,
                mapConfiguration: mapConfigurationID,
                styleAPIVersion: '2023-03-01-preview',
                subscriptionKey: subscriptionKey
            });

            map.events.add('ready', function () {

                // Add a map style selection control.
                const levelControl = new atlas.control.LevelControl({
                    position: "top-right",
                });
                geolocationControl = new atlas.control.GeolocationControl();

                //Add events to the control.

                //Add control and a style control to the map.
                map.controls.add(geolocationControl, {
                    position: 'bottom-right'
                });
                // Create an indoor maps manager and add a level control to the indoor manager.
                indoorManager = new atlas.indoor.IndoorManager(map, {
                    levelControl: levelControl,
                    //statesetId: statesetId
                });
                //indoorManager.setDynamicStyling(true);
            
                // Add event for Displaying geolocation information.
                map.events.add('geolocationerror', geolocationControl, displayEventInfo);
                map.events.add('geolocationsuccess', geolocationControl, displayEventInfo);
                // Add event for when the focused facility level changes.
                map.events.add('levelchanged', indoorManager, (eventData) => {
                    writeToInfoPanel('The level has changed:', eventData)
                });
                // Add event for when the focused facility changes.
                map.events.add('facilitychanged', indoorManager, (eventData) => {
                    writeToInfoPanel('The facility has changed:', eventData);
                });
                // Upon a mouse click, write the feature properties to the info panel.
                map.events.add('click', function (e) {
                    var features = map.layers.getRenderedShapes(e.position, 'unit');
                    if (features.length > 0 && features[0].properties) {
                        writeToInfoPanel('Feature clicked:', features[0].properties);
                    }
                    //lat&long data for a click event
                    console.log(e.position)
                });

                //Load a custom image icon into the map resources.
                map.imageSprite.createFromTemplate('arrow-icon', 'marker-arrow', 'teal', '#fff').then(function () {

                    //Create data sources and add them to the map.
                    lineSource = new atlas.source.DataSource();
                    pinSource = new atlas.source.DataSource();
                    map.sources.add([lineSource, pinSource]);

                    //Create a layer to render the path.
                    map.layers.add(new atlas.layer.LineLayer(lineSource, null, {
                        strokeColor: 'Black',
                        strokeWidth: 2
                    }));

                    //Extract the positions to highlight the full route on the map as a line.
                    var path = [];
                    routePoints.forEach(f => {
                        path.push(f.geometry.coordinates);
                    });
                    //Create a line for the path and add it to the data source.
                    lineSource.add(new atlas.data.LineString(path));

                    //Create a layer to render a symbol which we will animate.
                    map.layers.add(new atlas.layer.SymbolLayer(pinSource, null, {
                        iconOptions: {
                            //Pass in the id of the custom icon that was loaded into the map resources.
                            image: 'arrow-icon',
                            //Anchor the icon to the center of the image.
                            anchor: 'center',
                            //Rotate the icon based on the rotation property on the point data.
                            //The arrow icon being used in this case points down, so we have to rotate it 180 degrees.
                            rotation: ['+', 180, ['get', 'heading']],
                            //Have the rotation align with the map.
                            rotationAlignment: 'map',
                            //For smoother animation, ignore the placement of the icon. This skips the label collision calculations and allows the icon to overlap map labels. 
                            ignorePlacement: true,
                            //For smoother animation, allow symbol to overlap all other symbols on the map.
                            allowOverlap: true
                        },
                        textOptions: {
                            //For smoother animation, ignore the placement of the text. This skips the label collision calculations and allows the text to overlap map labels.
                            ignorePlacement: true,
                            //For smoother animation, allow text to overlap all other symbols on the map.
                            allowOverlap: true
                        }
                    }));
                    //Create a pin and wrap with the shape class and add to data source.
                    pin = new atlas.Shape(routePoints[0]);
                    pinSource.add(pin);

                    //Create the animation.
                    animation = atlas.animations.moveAlongRoute(routePoints, pin, {
                        //Specify the property that contains the timestamp.
                        timestampProperty: 'timestamp',
                        //Capture metadata so that data driven styling can be done.
                        captureMetadata: true,
                        //Animate such that 1 second of animation time = 1 minute of data time.
                        speedMultiplier: 120,
    
                    });
                });
            });
        }
        function writeToInfoPanel(message, details) {
            // Remove "map" object from json to prevent circular reference
            var obj = Object.assign({}, details, { map: undefined });

            document.getElementById('infoPanel-msg').innerHTML = message;
            document.getElementById('infoPanel-json').value = JSON.stringify(obj, null, 3);
        }
        function displayEventInfo(e) {
            navigator.geolocation.getCurrentPosition((position) => {
                outputValue = {
                    'Altitude:': position.coords.altitude,
                    'Latitude:': position.coords.latitude,
                    //'Event Latitude:': e.geometry.coordinates,
                    'Longitude:': position.coords.longitude,
                    'Timstamp:': e.properties.timestamp
                };
                //console.log(outputValue);
                document.getElementById('eventInfo').value = JSON.stringify(outputValue, null, '    ');
            });
        }
        function update() {
            geolocationControl.setOptions({
                showUserLocation: document.getElementById('showUserLocation').checked,
                trackUserLocation: document.getElementById('trackUserLocation').checked,
                calculateMissingValues: document.getElementById('calculateMissingValues').checked,
                updateMapCamera: document.getElementById('updateMapCamera').checked,
                positionOption: {
                    enableHighAccuracy: document.getElementById('enableHighAccuracy').checked,
                }
            });
        }
        function openTab(elm, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            elm.className += " active";
        }
        
    </script>
    <style>
        #eventInfo {
            width: auto;
            height: auto;
            overflow-y: visible;
        }
        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 6px 8px;
            transition: 0.3s;
            font-size: 14px;
        }
        .tab button:hover {
            background-color: #ddd;
        }

        .tab button.active {
            background-color: #ccc;
        }
        .tabcontent {
            display: none;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
        }
        .sidePanel {
            height:auto;
            
        }
    </style>
</head>
<body onload="GetMap()">
    <div id="myMap" style="position:absolute;width:100%;height:85vh;"></div>
    <!--<div id="infoPanel"
        style="position:absolute;top:10px;width:23vh;height:23vh;background-color:white;padding:1px;">
        <div id="infoPanel-msg"></div>
        <textarea id="infoPanel-json" style="width:22vh;height:22vh;"></textarea>
    </div>
    <div style="position:absolute;top:225px;border-radius:5px;padding:5px;background-color:white;">
        <input type="button" value="Play" onclick="animation.play()" title="Play" />
        <input type="button" value="Pause" onclick="animation.pause()" title="Pause" />
        <input type="button" value="Stop" onclick="animation.stop()" title="Stop" />
        <input type="button" value="Reset" onclick="animation.reset()" title="Reset" />
    </div>-->
    <div style="position:absolute">
        <fieldset class="sidePanel">
            <div class="tab">
                <button class="tablinks active" onclick="openTab(this, 'Options')" title="Options">Options</button>
                <button class="tablinks" onclick="openTab(this, 'EventInfo')" title="Event info">Event info</button>
            </div>
            <div id="Options" class="tabcontent" style="display:block;">
                <table>
                    <tr title="Shows the users location on the map using a marker.">
                        <td>Show user location:</td>
                        <td><input id="showUserLocation" type="checkbox" checked="checked" onclick="update()"
                                title="Show user location" /></td>
                    </tr>
                    <tr title="Shows the users current location on the map and updates it as they move.">
                        <td>Track user location:</td>
                        <td><input id="trackUserLocation" type="checkbox" onclick="update()" title="Track user location" /></td>
                    </tr>
                    <tr
                        title="Specifies that if the speed or heading values are missing in the geolocation position, it will calculate these values based on the last known position.">
                        <td>Calculate missing values:</td>
                        <td><input id="calculateMissingValues" type="checkbox" onclick="update()"
                                title="Calculate missing values" /></td>
                    </tr>
                    <tr
                        title="Specifies if the map camera should update as the position moves. When set to `true`, the map camera will update to the new position, unless the user has interacted with the map.">
                        <td>Update map camera:</td>
                        <td><input id="updateMapCamera" type="checkbox" checked="checked" onclick="update()"
                                title="Update map camera" /></td>
                    </tr>
                    <tr>
                        <td>Position option: Enable high accuracy</td>
                        <td><input id="enableHighAccuracy" type="checkbox" onclick="update()" title="Enable high accuracy" />
                        </td>
                    </tr>
                </table>
                <br />
            </div>
        
            <div id="EventInfo" class="tabcontent">
                <b>Event info</b><br />
                <textarea id="eventInfo" title="Event info"></textarea>
            </div>
        </fieldset>

    </div>
    
</body>
</html>
