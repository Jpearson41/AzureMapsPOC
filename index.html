<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>Indoor Maps Demo Tracking App</title>
    
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.css" type="text/css" />
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/indoor/0.2/atlas-indoor.min.css" type="text/css" />
    
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js"></script>
    <script src="https://atlas.microsoft.com/sdk/javascript/indoor/0.2/atlas-indoor.min.js"></script>
    
    <!-- Add reference to the animation module. -->
    <script src="azure-maps-animations.min.js"></script>
    <script src="azure-maps-geolocation-control.min.js"></script>

    <script>
        
        atlas.setDomain('us.atlas.microsoft.com');

        var geolocationControl;
        
        function GetMap() {           
            //Initialize a map instance.
            var map = new atlas.Map('myMap', {
                center: [-100, 40],
                zoom: 4,
                view: 'Auto',
                subscriptionKey: 'FDOZh4ozbgzgiXEUjXeLos7XxQ6puFO0okiKocbIxz8'
            });
            
            map.events.add('ready', function () {
                geolocationControl = new atlas.control.GeolocationControl();

                map.controls.add(geolocationControl, {
                    position: 'bottom-right'
                });
                // Add event for Displaying geolocation information.
                map.events.add('geolocationerror', geolocationControl, displayEventInfo);
                map.events.add('geolocationsuccess', geolocationControl, displayEventInfo);
            });
        }
        
        function displayEventInfo(e) {
            navigator.geolocation.getCurrentPosition((position) => {
                outputValue = {
                    'Altitude:': position.coords.altitude,
                    'Latitude:': position.coords.latitude,
                    'Longitude:': position.coords.longitude,
                    'Accuracy': position.coords.accuracy,
                    'Timestamp:': e.properties.timestamp,
                };
                //console.log(outputValue);
                document.getElementById('eventInfo').value = JSON.stringify(outputValue, null, '    ');
            });
        }
        function update() {
            geolocationControl.setOptions({
                showUserLocation: document.getElementById('showUserLocation').checked,
                trackUserLocation: document.getElementById('trackUserLocation').checked,
                updateMapCamera: document.getElementById('updateMapCamera').checked,
                positionOption: {
                    enableHighAccuracy: document.getElementById('enableHighAccuracy').checked,
                }
            });
        }
        function openTab(elm, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            elm.className += " active";
        }
        
    </script>
    <style>
        #eventInfo {
            width: 285px;
            height: 110px;
            overflow-y: visible;
        }
        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 6px 8px;
            transition: 0.3s;
            font-size: 14px;
        }
        .tab button:hover {
            background-color: #ddd;
        }

        .tab button.active {
            background-color: #ccc;
        }
        .tabcontent {
            display: none;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
        }
        .sidePanel {
            height:auto;
        }
    </style>
</head>
<body onload="GetMap()">
    <div id="myMap" style="position:absolute;width:100%;height:85vh;"></div>
    <div style="position:absolute">
        <fieldset class="sidePanel">
            <div class="tab">
                <button class="tablinks active" onclick="openTab(this, 'Options')" title="Options">Options</button>
                <button class="tablinks" onclick="openTab(this, 'EventInfo')" title="Event info">Event info</button>
            </div>
            <div id="Options" class="tabcontent" style="display:block;">
                <table>
                    <tr title="Shows the users location on the map using a marker.">
                        <td>Show user location:</td>
                        <td><input id="showUserLocation" type="checkbox" checked="checked" onclick="update()"
                                title="Show user location" /></td>
                    </tr>
                    <tr title="Shows the users current location on the map and updates it as they move.">
                        <td>Track user location:</td>
                        <td><input id="trackUserLocation" type="checkbox" onclick="update()" title="Track user location" /></td>
                    </tr>
                    <tr
                        title="Specifies if the map camera should update as the position moves. When set to `true`, the map camera will update to the new position, unless the user has interacted with the map.">
                        <td>Update map camera:</td>
                        <td><input id="updateMapCamera" type="checkbox" checked="checked" onclick="update()"
                                title="Update map camera" /></td>
                    </tr>
                    <tr>
                        <td>Position option: Enable high accuracy</td>
                        <td><input id="enableHighAccuracy" type="checkbox" onclick="update()" title="Enable high accuracy" />
                        </td>
                    </tr>
                </table>
                <br />
            </div>
        
            <div id="EventInfo" class="tabcontent">
                <b>Event info</b><br />
                <textarea id="eventInfo" title="Event info"></textarea>
            </div>
        </fieldset>

    </div>
    
</body>
</html>
